spring.flyway.enabled=false

# --- Database (In-Memory for Tests) ---
# This ensures tests never touch your physical ./data/ folder
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
# Recreates the schema from scratch for every test run
spring.jpa.hibernate.ddl-auto=create-drop

# --- H2 Console (disabled - no browser during tests) ---
spring.h2.console.enabled=false

# --- Logging (Console only for Tests) ---
# Disables file logging during tests to avoid cluttering /logs
logging.file.name=logs/device-management-test.log
logging.level.root=WARN
logging.level.com.device.management=DEBUG