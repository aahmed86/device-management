# --- Database (In-Memory for Tests) ---
# This ensures tests never touch your physical ./data/ folder
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
# Recreates the schema from scratch for every test run
spring.jpa.hibernate.ddl-auto=create-drop

# --- H2 Console (Keep restricted to local/test - Disable in Production) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Logging (Console only for Tests) ---
# Disables file logging during tests to avoid cluttering /logs
logging.file.name=logs/device-management-test.log
logging.level.root=WARN
logging.level.com.device.management=DEBUG

# --- Security (Test Credentials) ---
# Optional: Use static credentials for automated tests
#spring.security.user.name=test-admin
