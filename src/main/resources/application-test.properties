spring.flyway.enabled=false

# --- Database (In-Memory H2 - fresh schema per test run) ---
# MODE=PostgreSQL: same reasoning as dev - keeps syntax consistent.
# DB_CLOSE_DELAY=-1: keeps the in-memory DB alive for the full test session.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}

# Required - same reason as dev: prevents Hibernate from loading PostgreSQLDialect
# against an H2 connection, which causes the information_schema error.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: creates schema before tests, drops it after.
# Combined with @DirtiesContext in DeviceIntegrationTest this gives a clean
# database for every integration test method.
spring.jpa.hibernate.ddl-auto=create-drop

# H2 console not needed during automated test runs
spring.h2.console.enabled=false

# --- Logging ---
logging.file.name=logs/device-management-test.log
logging.level.root=WARN
logging.level.com.device.management=DEBUG