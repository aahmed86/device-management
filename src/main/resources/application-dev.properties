# --- Database Persistence (File-based) ---
spring.datasource.url=jdbc:h2:file:./data/devicedb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update

# --- H2 Console (Keep restricted to local/dev) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Logging (Console only for Tests) ---
# Disables file logging during tests to avoid cluttering /logs
logging.file.name=logs/device-management-dev.log
logging.level.root=WARN
logging.level.com.device.management=DEBUG

# --- Security (Test Credentials) ---
# Optional: Use static credentials for automated tests
#spring.security.user.name=test-admin
