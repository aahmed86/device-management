spring.flyway.enabled=false

# --- Database (File-based H2 - persists between restarts) ---
# MODE=PostgreSQL makes H2 behave like PostgreSQL:
#   - BIGSERIAL becomes auto-increment (compatible with Flyway migrations)
#   - Case-insensitive identifiers by default
#   - PostgreSQL-compatible functions and syntax
# DATABASE_TO_UPPER=FALSE prevents H2 from uppercasing column names,
#   which would break Hibernate's lowercase column references
spring.datasource.url=jdbc:h2:file:./data/devicedb;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}

# H2Dialect is required when using H2 regardless of MODE=PostgreSQL.
# Without it, Hibernate defaults to the dialect inferred from the driver,
# which may pick PostgreSQLDialect and then fail on information_schema queries.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# update = add new columns/tables on startup but never drop existing data.
# Safe for dev persistence. If a column-not-found error occurs after adding
# an entity field, delete ./data/ once and restart - it will rebuild correctly.
spring.jpa.hibernate.ddl-auto=update

# --- H2 Console (dev only - disabled in production) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Logging ---
logging.file.name=logs/device-management-dev.log
logging.level.root=WARN
logging.level.com.device.management=DEBUG