spring.flyway.enabled=false

# --- Database Persistence (File-based) ---
spring.datasource.url=jdbc:h2:file:./data/devicedb;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_UPPER=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=create-drop

# --- H2 Console (Keep restricted to local/dev) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Logging (Console only for Tests) ---
# Disables file logging during tests to avoid cluttering /logs
logging.file.name=logs/device-management-dev.log
logging.level.root=WARN
logging.level.com.device.management=DEBUG